[package]
name = "facturecraft"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
eframe = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
printpdf = "0.3"
lopdf = "0.26"
ttf-parser = "0.25"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
rfd = "0.15"
facturecraft-core = { path = "../core" }
craft-mcp = { git = "https://github.com/storytold/craft-libs", rev = "7a7a18cb40ac4cd5fca29c0dc224ac5178d40a89" }
craft-jsonrpc = { git = "https://github.com/storytold/craft-libs", rev = "7a7a18cb40ac4cd5fca29c0dc224ac5178d40a89" }

